<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>html段落</title>
</head>
<body>
<!--
    ✅核心特点
  1.段落标签是块级标签，每个<p> 独占一行，前后自动换行
  2.表示一段相关的文本内容，具有段落语义
  3.浏览器默认为段落添加上下外边距（margin）
  4.<p> 内不能包含 <div>、<h1>、<p> 等块级元素
  5.可包含 <span>、<a>、<strong>、<em>、<img> 等
  ✅使用规范
  1.用于成段文本：适合正文段落，而非单行文字或标题。
  2.不要用 <p> 代替换行：空 <p> 或大量 <br> 换行是错误做法。
  3.不要嵌套段落：<p> 内不能再放 <p>，浏览器会自动闭合外层段落。
  4.不要用 <p> 做布局：布局应使用 CSS 和语义化容器（如 <div>、<section>）。
-->
<p>这是一个段落。</p>
<p>这是另一个段落。</p>
</body>
</html>
