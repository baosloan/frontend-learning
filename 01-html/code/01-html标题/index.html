<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>html标题</title>
</head>
<body>
<!--
  ✅核心特点
  1.HTML 提供了 6 个级别的标题标签，从 <h1> 到 <h6>，用于定义文档的标题层级结构。
  2.每个标题独占一行，前后自动换行
  3.浏览器默认加粗，字号从 h1 到 h6 递减
  4.默认样式可通过 CSS 修改
  ✅使用规范
  1.每页建议只有一个 <h1>：通常作为页面主标题（如网站 Logo 或文章标题）。
  2.按层级顺序使用：不要跳级，例如从 <h1> 直接跳到 <h3> 会破坏文档结构。
  3.不要用标题标签控制字号：若只为改变文字大小，应使用 CSS，而非滥用 <h2> 等标签。
  4.标题应简洁描述内容：标题标签是 SEO 和可访问性的重要依据。
  ✅SEO与可访问性
  1.SEO：搜索引擎通过标题标签理解页面结构，<h1> 权重最高，合理使用有助于排名。
  2.屏幕阅读器：视障用户常通过标题层级快速导航页面，规范的标题结构能提升无障碍体验。
  3.文档大纲：标题标签共同构成页面的内容大纲（Outline）。
-->
<h1>一级标题h1</h1>
<h2>二级标题h2</h2>
<h3>三级标题h3</h3>
<h4>四级标题h4</h4>
<h5>五级标题h5</h5>
<h6>六级标题h6</h6>
</body>
</html>
