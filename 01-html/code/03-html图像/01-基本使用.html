<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>基本用法</title>
</head>
<body>
<!--
  ✅基本概念
  1.HTML 使用 <img> 标签在页面中嵌入图像。它是一个空元素（void element），没有闭合标签，必须依靠属性来工作。
  ✅核心属性
  1.src属性是必须的，图像文件的 URL（相对路径或绝对路径）
  2.alt属性是非必需的，但是强烈建议写上，图像的替代文本；图片无法显示时展示，也是屏幕阅读器读取的内容
  3.width、height属性，用来设置显示的宽高(单位像素)，强烈建议设置，
    有助于避免布局抖动（CLS）为避免图片拉伸，高度或者宽度建议只设置一个，让另一个等比拉伸
  4.title属性，可选，鼠标悬停时的提示文字（不能替代 alt）
  5.loading属性，可选，lazy 懒加载 / eager 立即加载
  6.srcset / size属性,	可选，响应式图片，按条件选择不同尺寸的图源
  7.usemap属性，可选，关联图像映射（配合 <map>、<area>）
  ✅核心特点
  1.属于行内标签，但是可以设置宽高、因为是可替换标签
  2.显示内容由外部资源决定，尺寸受 width/height 控制
  3.未设置宽高时按图片原始尺寸显示
-->
<img src="./assets/autumn-480x320.png" alt="秋天">
</body>
</html>
